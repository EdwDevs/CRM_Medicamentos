<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="manifest.json" />
    <title>CRM Medicamentos — Profesional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --sidebar-w: 260px;
            --sidebar-w-collapsed: 80px;
            --header-h: 70px;
            --drawer-w: 480px;
            --row-h: 48px;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --focus-ring: 0 0 0 3px rgb(59 130 246 / 0.3);
        }
        html, body { height: 100%; margin: 0; }
        body { font-feature-settings: "cv02","cv03","cv04","cv11"; -webkit-font-smoothing: antialiased; background: #f8fafc; }
        .app { display: flex; flex-direction: column; min-height: 100vh; }
        .app-header { height: var(--header-h); background: white; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; position: sticky; top: 0; z-index: 40; }
        .app-header .logo { display: flex; align-items: center; gap: 0.75rem; font-weight: 700; font-size: 1.25rem; color: #1e293b; }
        .app-header .logo img { height: 28px; width: auto; }
        .app-header .actions { display: flex; align-items: center; gap: 1rem; }
        .app-sidebar { position: fixed; left: 0; top: var(--header-h); bottom: 0; width: var(--sidebar-w); background: #0f172a; color: #e2e8f0; overflow-y: auto; transition: transform 0.25s ease, width 0.25s ease; z-index: 50; }
        .app-sidebar.collapsed { width: var(--sidebar-w-collapsed); }
        .app-sidebar .brand { padding: 1.5rem; text-align: center; border-bottom: 1px solid #1e293b; }
        .app-sidebar .brand-text { font-weight: 600; font-size: 1.125rem; color: white; display: block; }
        .app-sidebar .brand-text.collapsed-only { display: none; }
        .app-sidebar.collapsed .brand-text.full { display: none; }
        .app-sidebar.collapsed .brand-text.collapsed-only { display: block; }
        .app-sidebar .nav { margin-top: 1.5rem; }
        .app-sidebar .nav-item { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.5rem; border-radius: var(--radius-md); cursor: pointer; color: #cbd5e1; transition: background 0.15s, color 0.15s; }
        .app-sidebar .nav-item:hover { background: #1e293b; color: white; }
        .app-sidebar .nav-item.active { background: #2563eb; color: white; box-shadow: 0 4px 12px -2px rgb(37 99 235 / 0.4); }
        .app-sidebar .nav-item .icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
        .app-sidebar .nav-item .label { font-weight: 500; white-space: nowrap; }
        .app-sidebar .nav-item .badge { margin-left: auto; background: #1e293b; color: #fff; padding: 0.2rem 0.5rem; border-radius: 999px; font-size: 0.75rem; }
        .app-sidebar .nav-item.collapsed-only .label { display: none; }
        .app-sidebar.collapsed .nav-item .label { display: none; }
        .app-sidebar.collapsed .nav-item .badge { margin-left: 0; }
        .app-main { flex: 1; overflow-y: auto; padding: 2rem; margin-left: var(--sidebar-w); transition: margin-left 0.25s ease; }
        .app-sidebar.collapsed ~ .app-main { margin-left: var(--sidebar-w-collapsed); }
        @media (max-width: 1024px) {
            .app-sidebar { transform: translateX(-100%); }
            .app-sidebar.mobile-open { transform: translateX(0); }
            .app-main { margin-left: 0; }
            .app-header { padding: 0 1rem; }
        }
        .app-drawer { position: fixed; top: 0; right: 0; height: 100vh; width: var(--drawer-w); background: white; box-shadow: -4px 0 12px -2px rgb(0 0 0 / 0.15); transform: translateX(100%); transition: transform 0.25s ease; z-index: 60; overflow-y: auto; }
        .app-drawer.open { transform: translateX(0); }
        .app-drawer-overlay { position: fixed; inset: 0; background: rgb(15 23 42 / 0.4); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 55; }
        .app-drawer-overlay.open { opacity: 1; pointer-events: auto; }
        .app-drawer-header { padding: 1.5rem; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .app-drawer-title { font-weight: 600; font-size: 1.25rem; color: #1e293b; }
        .app-drawer-close { background: none; border: none; font-size: 1.25rem; color: #64748b; cursor: pointer; }
        .app-drawer-close:hover { color: #334155; }
        .app-content { padding: 2rem; }
        .app-title { font-weight: 700; font-size: 1.75rem; color: #1e293b; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; }
        .app-title .icon { width: 24px; height: 24px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: white; border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.04), 0 1px 2px -1px rgb(0 0 0 / 0.04); border: 1px solid #f1f5f9; transition: transform 0.1s, box-shadow 0.1s; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px -2px rgb(0 0 0 / 0.08); }
        .stat-card .label { font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .stat-card .value { font-size: 2.25rem; font-weight: 800; color: #1e293b; line-height: 1; }
        .stat-card .subtext { font-size: 0.875rem; color: #64748b; margin-top: 0.5rem; }
        .stat-card .progress { height: 6px; background: #e2e8f0; border-radius: 9999px; overflow: hidden; margin-top: 1rem; }
        .stat-card .progress-bar { height: 100%; background: #2563eb; transition: width 0.3s ease; }
        .filters-card { background: white; border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.04), 0 1px 2px -1px rgb(0 0 0 / 0.04); border: 1px solid #f1f5f9; margin-bottom: 2rem; }
        .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-size: 0.875rem; font-weight: 600; margin-bottom: 0.25rem; color: #334155; }
        .filter-group input, .filter-group select { padding: 0.5rem 0.75rem; border: 1px solid #e2e8f0; border-radius: var(--radius-md); background: white; font-size: 0.875rem; }
        .filter-group input:focus, .filter-group select:focus { outline: none; border-color: #3b82f6; box-shadow: var(--focus-ring); }
        .table-responsive { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid #e2e8f0; background: white; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th, td { padding: 1rem; text-align: left; font-size: 0.875rem; }
        thead { background: #f8fafc; }
        thead th { font-weight: 600; color: #475569; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; border-bottom: 2px solid #e2e8f0; }
        tbody tr { border-bottom: 1px solid #f1f5f9; transition: background 0.1s; }
        tbody tr:hover { background: #f8fafc; }
        tbody tr.selected { background: #eff6ff; }
        .badge { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.25rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
        .badge-success { background: #dcfce7; color: #16a34a; }
        .badge-warning { background: #fef3c7; color: #d97706; }
        .badge-info { background: #dbeafe; color: #2563eb; }
        .btn-primary { background: #2563eb; color: white; border: none; padding: 0.5rem 1rem; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; transition: background 0.15s; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: white; color: #64748b; border: 1px solid #e2e8f0; padding: 0.5rem 1rem; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; transition: background 0.15s; }
        .btn-secondary:hover { background: #f8fafc; }
        .btn-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 0.5rem 1rem; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; transition: background 0.15s; }
        .btn-danger:hover { background: #fee2e2; }
        .btn-outline { background: transparent; color: #2563eb; border: 1px solid #2563eb; padding: 0.5rem 1rem; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; transition: background 0.15s, color 0.15s; }
        .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 80; }
        .toast { background: white; padding: 0.75rem 1rem; border-radius: var(--radius-lg); box-shadow: 0 4px 12px -2px rgb(0 0 0 / 0.15); display: flex; align-items: center; gap: 0.75rem; min-width: 280px; border-left: 4px solid #2563eb; animation: slideRight 0.3s ease; }
        .toast.success { border-left-color: #16a34a; }
        .toast.error { border-left-color: #dc2626; }
        @keyframes slideRight { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .chart-container { background: white; border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.04), 0 1px 2px -1px rgb(0 0 0 / 0.04); border: 1px solid #f1f5f9; margin-bottom: 2rem; }
    </style>
</head>
<body>
    <div id="appShell" class="app">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <!-- Optional logo image -->
                <img src="https://via.placeholder.com/28x28?text=CM" alt="Logo">
                <div class="brand-text">CRM Medicamentos</div>
            </div>
            <div class="actions">
                <button id="themeToggle" class="btn-secondary" title="Cambiar tema">
                    <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" class="hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.352-5.646z"></path></svg>
                </button>
                <button id="sidebarToggle" class="btn-secondary" title="Colapsar/Expandir barra lateral">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <button id="quickCreateBtn" class="btn-primary" title="Nuevo pago">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    Nuevo Pago
                </button>
                <div id="userMenu" class="relative ml-4">
                    <button id="userMenuBtn" class="btn-secondary flex items-center gap-2" title="Usuario">
                        <span class="h-6 w-6 rounded-full bg-gray-200 flex items-center justify-center text-sm font-medium">ED</span>
                        <div>
                            <div class="text-sm font-medium">Edward S.</div>
                            <div class="text-xs text-gray-500">edwardse1491</div>
                        </div>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div id="userMenuDropdown" class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-1 hidden z-50">
                        <div class="px-4 py-2 text-sm text-gray-600">Mi perfil</div>
                        <div class="px-4 py-2 text-sm text-gray-600 border-t">Cerrar sesión</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Sidebar -->
        <aside id="appSidebar" class="app-sidebar">
            <div class="brand">
                <div class="brand-text full">CRM Medicamentos</div>
                <div class="brand-text collapsed-only">CM</div>
            </div>
            <nav class="nav">
                <a href="#" class="nav-item active" data-tab="dashboard">
                    <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 001 1h3m-3 0h9l-7-7-7-7z"></path></svg></div>
                    <div class="label">Dashboard</div>
                    <div class="badge" id="navCountDashboard">0</div>
                </a>
                <a href="#" class="nav-item" data-tab="payments">
                    <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg></div>
                    <div class="label">Pagos</div>
                    <div class="badge" id="navCountPayments">0</div>
                </a>
                <a href="#" class="nav-item" data-tab="pharmacies">
                    <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c4 0 6 4 6 6H6c0-2 2-4 6-4z"></path></svg></div>
                    <div class="label">Farmacias</div>
                    <div class="badge" id="navCountPharmacies">0</div>
                </a>
                <a href="#" class="nav-item" data-tab="reintegros">
                    <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m2 0H9m11 0H9m-3 10h3a2 2 0 002-2V9a2 2 0 012-2V5a2 2 0 00-2-2H9a2 2 0 00-2 2v2a2 2 0 01-2 2v2z"></path></svg></div>
                    <div class="label">Reintegros</div>
                    <div class="badge" id="navCountReintegros">0</div>
                </a>
                <a href="#" class="nav-item" data-tab="reports">
                    <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c4 0 6 4 6 6H6c0-2 2-4 6-4z"></path></svg></div>
                    <div class="label">Reportes</div>
                    <div class="badge" id="navCountReports">0</div>
                </a>
                <a href="#" class="nav-item" data-tab="settings">
                    <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3h6l-5-5V8H7a2 2 0 00-2 2v10a2 2 0 002 2h6l-3-3v-4z"></path></svg></div>
                    <div class="label">Configuración</div>
                    <div class="badge" id="navCountSettings">0</div>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="app-main">
            <div class="app-content">
                <div id="debugStatus" class="mb-4 text-sm text-gray-500">loading…</div>
                <h1 id="pageTitle" class="app-title">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c4 0 6 4 6 6H6c0-2 2-4 6-4z"></path></svg>
                    Dashboard
                </h1>

                <!-- Stats Grid -->
                <div class="stats-grid" id="statsGrid">
                    <!-- Will be filled by JS -->
                </div>

                <!-- Charts -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6" id="chartsContainer">
                    <div class="chart-container">
                        <canvas id="trendChart"></canvas>
                    </div>
                    <div class="chart-container">
                        <canvas id="productChart"></canvas>
                    </div>
                </div>

                <!-- Recent Payments -->
                <div class="mb-6">
                    <h2 class="text-xl font-semibold text-gray-800 mb-3 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                        Pagos recientes
                    </h2>
                    <div id="recentPaymentsList" class="space-y-2">
                        <!-- Filled by JS -->
                    </div>
                </div>

                <!-- Modules Panels (hidden by default, shown via JS) -->
                <section id="panels" class="hidden">
                    <div id="panel-dashboard" class="mb-6"></div>
                    <div id="panel-payments" class="mb-6">
                        <div class="filters-card" id="advancedFilters"></div>
                        <div class="mb-4">
                            <div id="gridResultCount" class="text-sm text-gray-500"></div>
                        </div>
                        <div class="table-responsive">
                            <table id="paymentsTable">
                                <thead id="gridHeader"></thead>
                                <tbody id="gridBody"></tbody>
                            </table>
                        </div>
                        <div class="mt-4 flex items-center justify-between">
                            <button id="prevPageBtn" class="btn-secondary">Anterior</button>
                            <button id="nextPageBtn" class="btn-primary">Siguiente</button>
                        </div>
                    </div>
                    <div id="panel-pharmacies" class="mb-6"></div>
                    <div id="panel-reintegros" class="mb-6"></div>
                    <div id="panel-reports" class="mb-6"></div>
                    <div id="panel-settings" class="mb-6"></div>
                </section>
            </div>
        </main>

        <!-- Drawer -->
        <div id="appDrawer" class="app-drawer">
            <div class="app-drawer-header">
                <h2 class="app-drawer-title" id="drawerTitle">Detalles</h2>
                <button id="drawerCloseBtn" class="app-drawer-close" aria-label="Cerrar">&times;</button>
            </div
    <script type="module" src="./script.js"></script>
